<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rede Governamental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; }
        .login-card { background: white; padding: 3rem; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .btn-primary { background: #004a8e; border: none; padding: 0.8rem; font-weight: 700; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="mb-4 text-primary"><i class="fas fa-shield-halved display-1"></i></div>
        <h3 class="fw-bold mb-1">Acesso Restrito</h3>
        <p class="text-muted small mb-4">Rede Governamental Integrada - RS</p>
        <input type="password" id="pass" class="form-control mb-3 text-center py-2" placeholder="Senha do Administrador">
        <button class="btn btn-primary w-100" onclick="login()">ENTRAR NO SISTEMA</button>
        <div id="err" class="text-danger mt-3 small" style="display:none;">Senha incorreta.</div>
    </div>
    <script>
        function login() {
            if(document.getElementById('pass').value === 'M0ntad0res!@#') {
                sessionStorage.setItem('adm_auth', 'true');
                window.location.href = 'dash.html';
            } else { document.getElementById('err').style.display = 'block'; }
        }
        document.addEventListener('keypress', (e) => { if(e.key === 'Enter') login(); });
    </script>
</body>
</html>
