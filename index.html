<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rede Governamental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --gold: #f9d616; --accent: #004a8e; }
        body { background: radial-gradient(circle at 20% 10%, #1e293b 0%, var(--primary) 55%); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1rem; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .login-card { position: relative; overflow: hidden; background: white; padding: 2.75rem 2.25rem 2.25rem; border-radius: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); width: 100%; max-width: 400px; text-align: center; }
        .login-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--gold); }
        .login-mark { width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 20px; background: var(--primary); color: var(--gold); display: grid; place-items: center; font-size: 2rem; }
        .login-title { font-weight: 800; color: var(--primary); }
        #pass { padding-top: 0.7rem; padding-bottom: 0.7rem; border-radius: 12px; border-color: #cbd5e1; }
        #pass:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,74,142,0.15); }
        .btn-primary { background: var(--accent); border: none; padding: 0.8rem; font-weight: 700; letter-spacing: 0.02em; border-radius: 12px; transition: background-color 0.2s; }
        .btn-primary:hover, .btn-primary:focus { background: #003a70; }
        .login-error { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 0.8rem; border-radius: 10px; background: #fff1f2; color: #be123c; font-weight: 600; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-mark" aria-hidden="true"><i class="fas fa-shield-halved"></i></div>
        <h1 class="h3 login-title mb-1">Acesso Restrito</h1>
        <p class="text-muted small mb-4">Rede Governamental Integrada - RS</p>
        <label for="pass" class="visually-hidden">Senha do Administrador</label>
        <input type="password" id="pass" class="form-control mb-3 text-center" placeholder="Senha do Administrador" autocomplete="current-password" autofocus>
        <button class="btn btn-primary w-100" onclick="login()">ENTRAR NO SISTEMA</button>
        <div id="err" class="mt-3 small" role="alert" style="display:none;"><div class="login-error"><i class="fas fa-circle-exclamation"></i>Senha incorreta.</div></div>
    </main>
    <script>
        function login() {
            if(document.getElementById('pass').value === 'M0ntad0res!@#') {
                sessionStorage.setItem('adm_auth', 'true');
                window.location.href = 'dash.html';
            } else { document.getElementById('err').style.display = 'block'; }
        }
        document.addEventListener('keypress', (e) => { if(e.key === 'Enter') login(); });
    </script>
</body>
</html>
